name: Build and push GHCR image

# 构建 buxiny/filebrowser 自用镜像并推送 GitHub Container Registry (ghcr.io)。
# 参考 hurlenko/filebrowser-docker 的设定（/data、/config、8080、FB_* 环境变量），
# 但改为编译本 fork 源码（含 TOTP 二次验证），多架构推送。

on:
  push:
    tags:
      - "v*"
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & push multi-arch image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute image tags
        id: tags
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG=${GITHUB_REF_NAME#v}
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/buxiny/filebrowser:$TAG,ghcr.io/buxiny/filebrowser:latest" >> "$GITHUB_OUTPUT"
          else
            SHA=${GITHUB_SHA::8}
            echo "version=$SHA" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/buxiny/filebrowser:$SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ghcr
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ format('{0}', github.event.head_commit.timestamp) }}
            VCS_REF=${{ github.sha }}
